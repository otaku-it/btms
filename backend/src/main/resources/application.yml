server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: bitan-village-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bitan_village?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:bitan}
    password: ${DB_PASSWORD:bitan_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:BitanAdmin2026!}
    session-hours: ${ADMIN_SESSION_HOURS:12}

logging:
  level:
    root: INFO
    com.bitan.village: INFO
